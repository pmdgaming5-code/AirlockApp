plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pmdgaming.airlock'
    compileSdk 35

    defaultConfig {
        applicationId 'com.pmdgaming.airlock'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.0.1'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
