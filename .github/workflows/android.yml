name: Build AirLock APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify toolchain
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed | head -80

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirLock-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish verified APK to repository
        if: github.ref == 'refs/heads/main' && success()
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/AirLock-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/AirLock-debug.apk
          if git diff --cached --quiet; then
            echo "APK already published"
          else
            git commit -m "chore: publish verified AirLock APK [skip ci]"
            git push
          fi

      - name: Publish build failure diagnostics
        if: failure() && github.ref == 'refs/heads/main'
        run: |
          mkdir -p dist
          {
            echo "AirLock build failed."
            echo "Commit: $GITHUB_SHA"
            echo "Runner: $RUNNER_OS"
            echo "Java:"
            java -version 2>&1 || true
            echo "Gradle:"
            gradle --version 2>&1 || true
            echo "SDK platforms:"
            ls -la "$ANDROID_SDK_ROOT/platforms" 2>&1 || true
          } > dist/build-failure.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/build-failure.log
          git commit -m "chore: record build failure [skip ci]" || true
          git push || true
