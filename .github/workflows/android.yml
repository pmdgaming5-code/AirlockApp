name: Build AirLock APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Download Gradle
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle.zip

      - name: Build debug APK
        run: gradle-8.9/bin/gradle --no-daemon clean assembleDebug

      - name: Build release APK
        run: gradle-8.9/bin/gradle --no-daemon assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: AirLock-APKs
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/release/*.apk
